# CAPTURE SCRIPT v3 — ProfitBase (BẢN ĐÃ LÀM SẠCH cho repo: tên lô cũ, id, URL thật, HWND đã thay bằng <placeholder>) · 15 shot R01–R15 → 13 chương storyboard B "Chapter tour" (U1 user 27/09) + số khổng lồ C ở 3 drop
# Soạn: Agent A (Ca 0) 27/09/2026 18:1x · VÒNG 2 18:4x (sửa theo nghiệm thu Opus stand-in + quyết định user "ok hết"). Nguồn số DUY NHẤT: footage/web-data-v3.md (mọi expected_on_screen/highlight.text có nguyên văn ở đó).
# Lint (G0, BẢN VÁ v3):  python scripts/capture/capture_log_to_edit.py lint --script capture/capture-script-v3.yaml --web-data footage/web-data-v3.md
# Build sau quay:         python scripts/capture/capture_log_to_edit.py build --script capture/capture-script-v3.yaml --log footage/capture-log.jsonl --markers footage/markers.txt --out data/
# Bản vá v3 (tools/capture_log_to_edit.v3.diff): action zoom/zoom_out (zoom TẠI NGUỒN ≤ 2.0×) · select · slider · key · inject · rec_stop ·
#   rec_start THEO FILE (markers `rec_start <epoch> <shot>`) · capture.crop_top thay crop.
# VÒNG 2: action rec_start (bước TRƯỚC nó = OFF-CAMERA) · shows_old_lots:true (lint FAIL nếu nằm trong khoảng ghi) · expect_value trên mọi type
#   (agent đọc lại value ô sau khi gõ, ghi vào capture-log; lệch = retake) · lô Demo DUY NHẤT: "Demo · Lot A" , KHÔNG lưu lô thứ 2.
#
# LUẬT QUAY (mỗi shot):
#  1. 1 file/shot (gfxcapture HWND, capture_cursor=0, 60 fps, CRF 14, -g 60) → ghi `rec_start <epoch> <shot>` vào footage/markers.txt ngay khi ffmpeg chạy.
#  2. Đầu mỗi Ca: tiêm scripts/capture/js/sdv-clean.js (cấu hình privacy riêng) rồi scripts/capture/js/sdv-capture-helpers.js; chạy __p11() (email/Super Admin/ADMIN/Opus/Phase 1/NEW = 0).
#     Full navigate (reload) XOÁ CSS → tiêm lại; đi route bằng sidebar/pushState thì CSS còn.
#  3. Mỗi step: gọi __sdvLog/__sdvZoom… lấy 1 dòng JSON → append footage/capture-log.jsonl TRƯỚC click điều hướng. JS TUẦN TỰ, cấm song song (lỗi 08:04).
#  4. Gõ = extension `type` từng ký tự 150 ms (không paste, không __sdvSet trên hình). Giữ ≥1 s sau khi số dừng; hover ≥1.5 s; 0.4 s trên mục menu trước khi bấm.
#  5. Số trên màn ≠ expected_on_screen → DỪNG, đo lại, sửa web-data + script, lint lại (không "quay đại").
#  6. D12 (v3.2): mỗi chương HERO có 1 lần `zoom` 1.8× giữ ≥ 1.5 s (nguồn macro→pull-back) — đã ghi thành step.
#  7. KHÔNG foreground khi user chưa báo "sẵn sàng" (CẦN MÁY YÊN — phiên chính báo user).

project: "ProfitBase — v3.2 storyboard B Chapter tour (13 chương, 20 màn)"
base_url: "https://<your-app>.example"
web_data: "footage/web-data-v3.md"
vo_script: "vo/v3/script.txt"      # 13 câu PLAN-v3.1 §4 (Agent B)

capture:
  browser_zoom: 100
  dpr: 1.0                      # ĐO P9 27/09 20:17 foreground: Chrome F11 (display-mode fullscreen) + extension ép viewport 1920×1010 @1 (JS: innerWidth 1920 · innerHeight 1010 · dpr 1)
  viewport_css: [1920, 1010]    # ĐO P9: khung gfxcapture 1920×1080; ô vuông CSS top:500 → y 570, bottom:0 → y 1060–1079, top:0 → y 70 (x khớp 1:1)
  crop_top: 70                  # ĐO P9: dải trắng debugger y 0–69 (pixel (20,69)=255 trắng, (20,70) = nền trang). KHÔNG có dải → trang tràn 1080 (khung 20:14) = offset 0 ⇒ mỗi shot kiểm bar_present
  viewport_origin_px: [0, 70]   # = [0, crop_top]
  crop_top_measured: true       # P9 20:17 + ĐO LẠI 21:56 sau relaunch Chrome : đỏ CSS y500→570, xanh bottom→1079, dải y0–69 ⇒ GIỐNG HỆT
  debugger_bar_rule: >-
    Cửa sổ gfxcapture KHÔNG được có dải "'Claude' đã bắt đầu gỡ lỗi cho trình duyệt này" thay đổi giữa shot. Chọn 1:
    (a) dải hiện suốt buổi → đo crop_top SAU khi dải ổn định, mọi shot cùng số; (b) bấm đóng dải trước rec_start mỗi shot và đo crop_top khi đã đóng;
    dải bật/tắt giữa shot = retake (khung nội dung nhảy). Ghi lựa chọn vào markers.txt.
  max_zoom: 1.5                 # camera hậu kỳ
  max_source_zoom: 2.0          # zoom TẠI NGUỒN (action zoom)

forbidden_pages: ["/admin", "/access-map", "/policy-pulse", "/logic-map", "/system-architecture", "/profile", "/sales", "/changelog"]
global_avoid:
  - {selector: "aside a[href='/profile']", reason: "email + Super Admin chân sidebar — sdv-clean thay bằng 'ProfitBase Demo'"}
  - {selector: "text=Admin Dashboard", reason: "nhóm quản trị sidebar (textContent 'Admin Dashboard', hiển thị HOA) — sdv-clean ẩn"}
  - {selector: "aside a[href='/logic-map']", reason: "mục quản trị trong HỆ THỐNG — sdv-clean ẩn cùng /system-architecture /access-map /policy-pulse"}
  - {selector: "text=<tên model AI>", reason: "tên model AI header /expert — sdv-clean cắt đuôi"}
  - {selector: "text=Phase 1: chat", reason: "ghi chú dev /expert — sdv-clean ẩn"}
  - {selector: "aria=Mở P&L AI Agent", reason: "nút chat nổi — sdv-clean ẩn"}
  - {selector: "text=<lô cũ 1>", reason: "tên lô CŨ trong Gợi Ý Hôm Nay — sdv-clean ẩn dòng"}
  - {selector: "text=<lô cũ 2>", reason: "tên lô CŨ ở /batches, /promotions/new — tránh khung"}
never_click:
  - "text=Xóa"
  - "aria=Xoá khoản này"
  - "text=Áp dụng giá này"
  - "text=Áp làm giá lô"
  - "text=Lưu thành định mức"
  - "text=Lưu chương trình"
  - "text=Xóa lịch sử chat"
  - "text=Cuộc trò chuyện mới"
  - "text=Đồng bộ"
  - "text=Bulk Import"
  - "text=Tạo Folder"
  - "text=Select All"             # R08b: chọn tay 4 SKU DEMO (Select All kéo cả SKU TEST cũ)
  - "dialog:text=Tạo Chiến Dịch"   # nút TRONG dialog KOC (nút mở dialog ở trang danh sách thì được bấm — selector khác: role=button:Tạo Chiến Dịch)
  - "dialog:text=Tạo"             # dialog Tạo Dự Án

